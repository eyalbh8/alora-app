service: menchly-api

provider:
  name: aws
  runtime: nodejs22.x
  stage: ${opt:stage, 'prod'}
  region: ${env:AWS_REGION, 'us-east-1'}
  profile: ${env:AWS_PROFILE, 'default'}
  environment:
    NODE_ENV: ${self:provider.stage}
    DATABASE_URL: ${env:DATABASE_URL}
    DESCOPE_PROJECT_ID: ${env:DESCOPE_PROJECT_ID}
    SOURCE_API_BASE: ${env:SOURCE_API_BASE, ''}
    SOURCE_API_KEY: ${env:SOURCE_API_KEY, ''}
    MCP_URL: ${env:MCP_URL, ''}
    MCP_API_KEY: ${env:MCP_API_KEY, ''}
    OPENAI_API_KEY: ${env:OPENAI_API_KEY, ''}
    ANTHROPIC_API_KEY: ${env:ANTHROPIC_API_KEY, ''}
    DAILY_CONTENT_LLM_MODEL: ${env:DAILY_CONTENT_LLM_MODEL, 'gpt-4o-mini'}
    DAILY_CONTENT_OPTIMIZER_FUNCTION: menchly-${self:provider.stage}-daily-content-optimizer
    ZERNIO_API_KEY: ${env:ZERNIO_API_KEY, ''}
    ZERNIO_API_BASE: ${env:ZERNIO_API_BASE, 'https://zernio.com/api/v1'}
    ZERNIO_WEBHOOK_SECRET: ${env:ZERNIO_WEBHOOK_SECRET, ''}
    PUBLIC_APP_URL: ${env:PUBLIC_APP_URL, ''}
    PUBLIC_CLIENT_URL: ${env:PUBLIC_CLIENT_URL, ''}
    ALLOWED_ORIGIN: ${env:ALLOWED_ORIGIN, '*'}
    AWS_LAMBDA_NODEJS_DISABLE_CALLBACK_WARNING: 1

  ecr:
    images:
      appimage:
        path: ../..
        file: apps/server/dockerfile
        platform: linux/amd64
        provenance: false
        buildArgs:
          DATABASE_URL: ${env:BUILD_DATABASE_URL, env:DATABASE_URL}

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - secretsmanager:GetSecretValue
          Resource:
            - 'arn:aws:secretsmanager:${self:provider.region}:*:secret:menchly-${self:provider.stage}*'
        - Effect: Allow
          Action:
            - ecr:GetAuthorizationToken
            - ecr:BatchCheckLayerAvailability
            - ecr:GetDownloadUrlForLayer
            - ecr:BatchGetImage
          Resource: '*'
        - Effect: Allow
          Action:
            - lambda:InvokeFunction
          Resource:
            - 'arn:aws:lambda:${self:provider.region}:*:function:menchly-${self:provider.stage}-daily-content-optimizer'

package:
  individually: true
  patterns:
    - '!node_modules/**'
    - '!.webpack/**'
    - '!.serverless/**'
    - '!.build/**'
    - '!test/**'
    - '!coverage/**'
    - '!.env*'
    - '!.git/**'
    - '!README.md'

functions:
  api:
    name: menchly-${self:provider.stage}-api
    image:
      name: appimage
      command:
        - dist/lambda.handler
    timeout: 29
    memorySize: 2048
    url: true
    events:
      - http:
          path: /
          method: ANY
          cors: true
      - http:
          path: /{proxy+}
          method: ANY
          cors: true
    environment:
      NODE_ENV: ${self:provider.stage}

  dailyContentScheduler:
    name: menchly-${self:provider.stage}-daily-content-scheduler
    image:
      name: appimage
      command:
        - dist/lambdas/daily-content-scheduler-lambda.handler
    timeout: 120
    memorySize: 1024
    events: ${self:custom.dailyContentScheduleEvents.${self:provider.stage}, []}

  dailyContentOptimizer:
    name: menchly-${self:provider.stage}-daily-content-optimizer
    image:
      name: appimage
      command:
        - dist/lambdas/daily-content-optimizer-lambda.handler
    timeout: 900
    memorySize: 2048

plugins:
  - serverless-offline

custom:
  serverless-offline:
    httpPort: 3003
    lambdaPort: 3004
    noPrependStageInUrl: true
    noTimeout: true
    useInProcess: true
  dailyContentScheduleEvents:
    prod:
      - schedule:
          rate: cron(*/5 * * * ? *)
          enabled: true
    dev: []
